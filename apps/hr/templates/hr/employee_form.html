{% extends "layout_app.html" %}

{% block title %}Nuevo empleado — ERP SaaS{% endblock %}

{% block app_content %}
<nav class="migas" aria-label="Ruta de navegación">
    <ol>
        <li><a href="{% url 'dashboard:panel' %}">Panel</a></li>
        <li><a href="{% url 'hr:employee_list' %}">RRHH</a></li>
        <li aria-current="page">Nuevo</li>
    </ol>
</nav>

<div class="encabezado-pagina">
    <h1>Nuevo empleado</h1>
</div>

<div class="tarjeta" style="max-width: 44rem;">
    <div class="tarjeta__cuerpo">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
            {% include "customers/_campo.html" with field=field %}
            {% endfor %}
            <button type="submit" class="btn btn--primario">Crear empleado</button>
        </form>
    </div>
</div>
{% endblock %}
