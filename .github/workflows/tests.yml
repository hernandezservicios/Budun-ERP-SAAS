name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-budun-erp-saas-dummy-key-for-github-actions
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PostgreSQL para CI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER testuser WITH PASSWORD 'testpass' SUPERUSER CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE testdb OWNER testuser;"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: python manage.py test
